name: echoloop
description: "EchoLoop - 英语跟读播放器（AB 片段循环 + 字幕跟读 + 录音对比）"
publish_to: 'none'

version: 1.0.7+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理（与已有 Flutter 项目保持一致，固定 2.x）
  flutter_riverpod: ^2.6.1

  # 本地数据库
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6

  # 播放内核（libmpv，本地音视频格式兼容性最强；变速走 pitch correction 不变调）
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8

  # 时间格式化（版本由 flutter_localizations 锁定为 0.20.2）
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
